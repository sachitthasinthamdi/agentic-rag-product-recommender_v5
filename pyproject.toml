[project]
name = "mark5"
version = "0.0.1"
description = "ระบบแนะนำสินค้าเชิงสนทนา (Agentic RAG) บนข้อมูล Amazon Products 2023"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v"

[tool.ruff]
line-length = 100
src = ["src", "config", "tests"]
